name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CLIMBS_DB_ID: ${{ secrets.NOTION_CLIMBS_DB_ID }}
          NOTION_PEAKS_DB_ID: ${{ secrets.NOTION_PEAKS_DB_ID }}
          NOTION_GEAR_DB_ID: ${{ secrets.NOTION_GEAR_DB_ID }}
          NOTION_PHOTOS_DB_ID: ${{ secrets.NOTION_PHOTOS_DB_ID }}

      # Preview deployment for PRs
      - name: Create Preview Deployment
        if: github.event_name == 'pull_request'
        id: preview-deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'preview',
              auto_merge: false,
              required_contexts: [],
              description: `Preview deployment for PR #${context.payload.pull_request.number}`
            });
            return deployment.data.id;
          result-encoding: string

      - name: Deploy to Preview
        if: github.event_name == 'pull_request'
        id: deploy-preview
        run: |
          OUTPUT=$(npx wrangler deploy --env preview 2>&1) || true
          echo "$OUTPUT"
          # Extract the preview URL from wrangler output
          PREVIEW_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL="https://climb-log-preview.kylieski.workers.dev"
          fi
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Update Preview Deployment Status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = ${{ steps.preview-deployment.outputs.result }};
            const previewUrl = '${{ steps.deploy-preview.outputs.preview_url }}' || 'https://climb-log-preview.kylieski.workers.dev';
            
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              environment_url: previewUrl,
              description: 'Preview deployment successful'
            });

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy-preview.outputs.preview_url }}' || 'https://climb-log-preview.kylieski.workers.dev';
            
            // Check for existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview deployment')
            );
            
            const body = `### Preview deployment ready!
            
            | Name | Link |
            |------|------|
            | Preview | ${previewUrl} |
            | Commit | \`${context.payload.pull_request.head.sha.substring(0, 7)}\` |
            
            _This preview will be updated on each push to this PR._`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }

      # Production deployment on push to main
      - name: Create Production Deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: prod-deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Production deployment'
            });
            return deployment.data.id;
          result-encoding: string

      - name: Deploy to Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy-prod
        run: |
          npx wrangler deploy
          echo "prod_url=https://climb-log.kylieski.workers.dev" >> $GITHUB_OUTPUT

      - name: Update Production Deployment Status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = ${{ steps.prod-deployment.outputs.result }};
            
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              environment_url: 'https://climb-log.kylieski.workers.dev',
              description: 'Production deployment successful'
            });

      - name: Handle Deployment Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            let deploymentId;
            if (context.eventName === 'pull_request') {
              deploymentId = '${{ steps.preview-deployment.outputs.result }}';
            } else {
              deploymentId = '${{ steps.prod-deployment.outputs.result }}';
            }
            
            if (deploymentId && deploymentId !== '') {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: parseInt(deploymentId),
                state: 'failure',
                description: 'Deployment failed'
              });
            }
